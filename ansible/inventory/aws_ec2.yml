---
plugin: amazon.aws.aws_ec2

regions:
  - ap-south-1

filters:
  instance-state-name: running
  "tag:Role": webserver
  "tag:Environment": dev

keyed_groups:
  - key: tags.Environment
    prefix: env
  - key: tags.Role
    prefix: role

hostnames:
  - dns-name

compose:
  ansible_host: public_dns_name
  ansible_user: ec2-user
  ansible_ssh_private_key_file: "~/.ssh/devops-training-key.pem"
